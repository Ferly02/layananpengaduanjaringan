{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="login-bg">
    <div class="card">
        <div class="logo-container" style="text-align: center; margin-bottom: 24px;">
            <img src="{% static 'img/logo-diskominfo.png' %}" alt="Logo Diskominfo" style="max-height: 80px; width: auto; object-fit: contain; margin: 0 auto;">
        </div>

        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-size: 20px; font-weight: 600; color: #1e293b;">Lupa Password</h2>
            <p style="font-size: 14px; color: var(--text-muted); margin-top: 4px;">Masukkan email atau username yang terdaftar untuk menerima tautan reset password.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div class="p-3 text-sm text-green-700 bg-green-100 rounded-lg" style="margin-bottom: 12px; font-size: 14px; padding: 12px; background-color: #dcfce3; color: #15803d; border-radius: 8px;">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            
            <div class="form-group">
                <label class="form-label">Email atau Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" name="username_email" class="form-input with-icon" placeholder="Masukkan email atau username" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 12px;">
                Kirim Tautan Reset
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
            </button>
        </form>

        <div class="card-footer" style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-muted);">
            Ingat password Anda? <a href="{% url 'login_user' %}" class="link" style="font-weight: 500;">Kembali ke Login</a>
        </div>
    </div>
</body>
</html>
