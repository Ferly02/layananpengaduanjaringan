{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login User</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="login-bg">
    <div class="card">
        <div class="logo-container" style="text-align: center; margin-bottom: 24px;">
            <img src="{% static 'img/logo-diskominfo.png' %}" alt="Logo Diskominfo" style="max-height: 80px; width: auto; object-fit: contain; margin: 0 auto;">
        </div>

        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-size: 20px; font-weight: 600; color: #1e293b;">Login User</h2>
            <p style="font-size: 14px; color: var(--text-muted); margin-top: 4px;">Silakan masuk ke akun Anda</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div class="p-3 text-sm text-red-700 bg-red-100 rounded-lg" style="margin-bottom: 12px; font-size: 14px; padding: 12px; background-color: #fee2e2; color: #b91c1c; border-radius: 8px;">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            
            <div class="form-group">
                <label class="form-label">Email atau Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" name="username" class="form-input with-icon" placeholder="Masukkan email atau username" required>
                </div>
            </div>

            <div class="form-group">
                <div class="flex-between" style="margin-bottom: 8px;">
                    <label class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="{% url 'lupa_password' %}" class="link">Lupa Password?</a>
                </div>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" name="password" id="password" class="form-input with-icon with-action" placeholder="Masukkan password" required>
                    <button type="button" class="input-action" onclick="togglePassword('password')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 12px;">
                Masuk 
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>

        <div class="card-footer" style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-muted);">
            Belum punya akun? <a href="{% url 'register' %}" class="link" style="font-weight: 500;">Daftar di sini</a>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
            } else {
                input.type = 'password';
                button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
            }
        }
    </script>
</body>
</html>
